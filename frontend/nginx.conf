server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Tu proyecto usa react-router-dom (rutas como /admin/dashboard, /paciente/citas, etc.)
    # Sin esto, al recargar una ruta que no es "/", Nginx devuelve 404
    # porque esas rutas no existen como archivos reales, solo las maneja React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
