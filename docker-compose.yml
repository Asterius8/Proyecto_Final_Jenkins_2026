services:
  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:3000/api
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY}
    container_name: clinica_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - clinica_network

  backend:
    build: ./backend
    container_name: clinica_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # OJO: dentro de la red de Docker, el host de la BD es el nombre del
      # servicio ("db"), y el puerto SIEMPRE es el interno del contenedor (3306),
      # no el 3307 que usas en tu .env local
      MYSQL1_HOST: db
      MYSQL1_USER: oscar
      MYSQL1_PASSWORD: oscar
      MYSQL1_DATABASE: bd_user_clinica_2025
      MYSQL1_PORT: 3306
      MYSQL2_HOST: db
      MYSQL2_USER: oscar
      MYSQL2_PASSWORD: oscar
      MYSQL2_DATABASE: bd_clinica_2025
      MYSQL2_PORT: 3306
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinica_network

  db:
    build: ./db
    container_name: clinica_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3310:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clinica_network

volumes:
  db_data:

networks:
  clinica_network:
    driver: bridge
